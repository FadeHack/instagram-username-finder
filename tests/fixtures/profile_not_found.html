<!-- Trimmed from a real instagram.com/<nonexistent>/ response (2026-08).
     Instagram answers HTTP 200 with a generic shell: no og:title,
     no og:description, no al:ios:url, and a bare <title>Instagram</title>.
     The page content is rendered client-side, so no "not available" text
     appears in the served HTML. -->
<!DOCTYPE html>
<html lang="en">
<head>
<title>Instagram</title>
<meta property="og:site_name" content="Instagram" />
</head>
<body><div id="react-root"></div><script>/* PolarisProfileRoot bundle */</script></body>
</html>
