[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "instagram-username-finder"
version = "0.1.0"
description = "A responsible, open-source Instagram username availability scanner."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "instagram-username-finder contributors" }]
keywords = ["instagram", "username", "availability", "cli", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/FadeHack/instagram-username-finder"
Repository = "https://github.com/FadeHack/instagram-username-finder"
Issues = "https://github.com/FadeHack/instagram-username-finder/issues"
Changelog = "https://github.com/FadeHack/instagram-username-finder/blob/main/CHANGELOG.md"

[project.scripts]
instagram-finder = "instagram_username_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_username_finder"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = ["integration: end-to-end scans against mocked transports"]

[tool.coverage.run]
source = ["instagram_username_finder"]
branch = true

# ----------------------------------------------------------------------
[tool.ruff]
line-length = 92
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "ASYNC",
  "RUF",
]
ignore = [
  "B008",   # function calls in argument defaults are used deliberately
  "UP042",  # models intentionally use `str, Enum` for JSON-friendly values
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["instagram_username_finder"]

# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
pretty = true

